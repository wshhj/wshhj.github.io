      <h1>如何建立长期学习系统</h1>
      <p>把输入、练习、输出与复盘组成一个可持续循环。</p>
    </header>
    <article class="article-body">
      
        <p>学习的目标不是“看过”，而是“能够使用”。</p>
        <h2>四个环节</h2>
        <ol>
          <li><strong>输入：</strong>选择高质量资料。</li>
          <li><strong>练习：</strong>通过真实问题进行应用。</li>
          <li><strong>输出：</strong>写文章、做项目或向别人解释。</li>
          <li><strong>复盘：</strong>检查哪些知识已经掌握，哪些仍然模糊。</li>
        </ol>
        <p>长期积累的关键，是把学习设计成可以重复执行的系统。</p>
