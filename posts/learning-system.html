<p>学习真正有效的标准不是“看过”，而是“能够解决问题”。</p>
<h2>四个环节</h2><p><strong>输入：</strong>选择高质量资料。<br><strong>练习：</strong>围绕真实问题动手。<br><strong>输出：</strong>写文章、做工具或解释给别人。<br><strong>复盘：</strong>检查自己是否真正掌握。</p>
<blockquote>长期能力来自稳定重复，而不是短期冲刺。</blockquote>
