<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单线 UART 充电器通讯工具 · Hero</title><link rel="stylesheet" href="../assets/style.css"></head><body><main class="container page"><a href="../projects.html" style="color:var(--muted);font-size:14px">← 返回项目</a><header class="article-header"><h1>单线 UART 充电器通讯工具</h1><p>模拟电池持续应答，支持充电器通讯测试。</p></header><section class="section" style="padding-top:28px"><div class="stats-grid"><div class="stat"><strong>UART</strong><span>通信协议</span></div><div class="stat"><strong>AUTO</strong><span>自动应答</span></div><div class="stat"><strong>HEX</strong><span>报文分析</span></div></div></section><section class="article-body"><h2>问题背景</h2><p>部分充电器只有识别到电池通讯后才允许稳定输出。</p><h2>解决方案</h2><p>使用 USB-TTL 与协议分析，提供报文发送、接收、自动应答和模拟电池功能。</p><h2>工程价值</h2><p>降低真实电池参与测试的依赖，提高协议异常定位效率。</p></section></main><footer class="footer"><div class="container footer-inner"><span>© 2026 Hero</span><div class="footer-links"><a href="../projects.html">项目</a><a href="../about.html">个人页</a></div></div></footer></body></html>
